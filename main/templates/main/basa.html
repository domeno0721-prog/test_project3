<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <nav>
        <div class="container">
            <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
                <a href="/"
                    class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                    <svg class="bi me-2" width="40" height="32">
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                    <span class="fs-4">Немецкий</span>
                </a>

                <ul class="nav nav-pills">
                    <li class="nav-item"><a href="{% url 'home' %}" class="nav-link active"
                            aria-current="page">Главная</a>
                    </li>
                    <li class="nav-item"><a href="{% url 'wort' %}" class="nav-link">Слова</a></li>
                    <li class="nav-item"><a href="{% url 'create' %}" class="nav-link">Добавить</a></li>
                </ul>
            </header>
        </div>

        {% if user.is_authenticated %}
        <span class="navbar-text">
            Привет, {{ user.username }}!
        </span>

        <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">Выйти</button>
        </form>

        {% else %}
        
        <a href="{% url 'login' %}" class="btn btn-success">Войти</a>
        <a href="{% url 'register' %}" class="btn btn-primary">Регистрация</a>
        {% endif %}
    </nav>
    <hr>


    {% block content %}{% endblock %}



    <hr>

    <footer>{% now 'Y' %}</footer>



</body>

</html>
